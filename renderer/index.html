<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>WiZ Bulb Control</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Control de Bombilla WiZ</h1>

    <section class="card">
      <label for="ip-input">Dirección IP</label>
      <div class="row">
        <input type="text" id="ip-input" placeholder="192.168.1.5" />
        <button id="discover-btn">Buscar en la red</button>
      </div>
      <p id="discovery-status" class="hint"></p>
    </section>

    <section class="card">
      <div class="row space-between">
        <span>Encendido <kbd id="power-shortcut-hint"></kbd></span>
        <label class="switch">
          <input type="checkbox" id="power-toggle" />
          <span class="slider-toggle"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <label for="dimming-slider" class="control-label">
        <span>Brillo: <span id="dimming-value">50</span>%</span>
        <kbd id="dimming-shortcut-hint"></kbd>
      </label>
      <input type="range" id="dimming-slider" min="1" max="100" value="50" />
    </section>

    <section class="card">
      <label for="color-picker">Color</label>
      <input type="color" id="color-picker" value="#ffffff" />
    </section>

    <section class="card">
      <label for="temp-slider" class="control-label">
        <span>Temperatura de color: <span id="temp-value">4000</span>K</span>
        <kbd id="temperature-shortcut-hint"></kbd>
      </label>
      <input type="range" id="temp-slider" min="2200" max="6500" step="100" value="4000" />
    </section>

    <details class="card settings-card">
      <summary>Atajos y preferencias</summary>
      <p class="hint settings-hint">Selecciona un campo y presiona la combinación que quieras usar. Usa Supr para desactivarlo.</p>

      <div class="shortcut-grid">
        <label for="shortcut-toggle-power">Encender/apagar</label>
        <input type="text" id="shortcut-toggle-power" class="shortcut-input" readonly />

        <label for="shortcut-temperature-up">Temperatura +</label>
        <input type="text" id="shortcut-temperature-up" class="shortcut-input" readonly />

        <label for="shortcut-temperature-down">Temperatura −</label>
        <input type="text" id="shortcut-temperature-down" class="shortcut-input" readonly />

        <label for="shortcut-dimming-up">Brillo +</label>
        <input type="text" id="shortcut-dimming-up" class="shortcut-input" readonly />

        <label for="shortcut-dimming-down">Brillo −</label>
        <input type="text" id="shortcut-dimming-down" class="shortcut-input" readonly />
      </div>

      <div class="settings-options">
        <label for="temperature-step">Incremento de temperatura</label>
        <select id="temperature-step">
          <option value="100">100 K</option>
          <option value="200">200 K</option>
          <option value="500">500 K</option>
        </select>

        <label for="dimming-step">Incremento de brillo</label>
        <select id="dimming-step">
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="20">20%</option>
        </select>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="feedback-enabled" />
        Mostrar indicador flotante
      </label>

      <div class="row settings-actions">
        <button id="save-settings-btn">Guardar preferencias</button>
        <button id="reset-settings-btn" class="secondary-button">Restaurar</button>
      </div>
      <p id="settings-status" class="hint" role="status"></p>
    </details>

    <section class="card">
      <button id="refresh-btn">Actualizar estado</button>
      <pre id="state-output" class="state-output"></pre>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
